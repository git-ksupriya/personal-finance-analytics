version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: personal_finance_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: personal_finance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Shiva@138
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./Personal_Finance/dbms/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d personal_finance"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: personal_finance_web
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:Shiva%40138@db:5432/personal_finance
      SECRET_KEY: production-cloud-secret-key-change-in-prod
      HOST: 0.0.0.0
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
